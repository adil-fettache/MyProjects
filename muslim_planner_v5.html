.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:#111b17;color:white;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:11px 14px;box-shadow:var(--shadow);max-width:min(92vw,520px);font-size:13px}.errorBox{border:1px solid rgba(180,91,88,.35);background:rgba(180,91,88,.12);padding:13px;border-radius:18px;color:var(--rose)}
  @media(max-width:980px){.layout{grid-template-columns:1fr}.side{display:none}.bottomNav{display:block}.app{padding:12px 12px 104px}.top{margin:0 -12px 14px;padding-left:12px;padding-right:12px}.pageHead h2{font-size:28px}.heroGrid,.g4,.g3,.g2,.statPanel{grid-template-columns:1fr}.prayerGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.prayerCard{min-height:110px}.hero{padding:19px}.hero h2{font-size:30px}.calli{font-size:34px}.topActions .desktopOnly{display:none}}

const defaultPrayerTimes={Fajr:'',Dhuhr:'',Asr:'',Maghrib:'',Isha:''};
let ui={page:'home',selectedDate:today(),calMonth:today().slice(0,7),onboardingStep:0,statsPeriod:30,quranSearch:'',quranSurah:1,arabicLesson:1,duaFilter:'Tous',quizChoice:null,quranLoading:false,quranError:''};
let quranData=null;
let state=loadState();
function initialState(){return {profile:null,goals:{quranVerses:10,arabicMinutes:10,dhikrTarget:100},settings:{theme:'light',prayerTimes:{...defaultPrayerTimes},habits:['Lire 10 versets','Réviser une leçon arabe','Faire une sadaqa ou bonne action'],quranAuto:false},logs:{},favorites:{duas:[]},arabic:{completed:{},quiz:{}},quran:{last:{surah:1,verse:1},installed:false,installedAt:null},createdAt:new Date().toISOString()};}
function loadState(){try{return deepMerge(initialState(),JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){return initialState();}}
function deepMerge(a,b){if(!b||typeof b!=='object')return a;Object.keys(b).forEach(k=>{if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))a[k]=deepMerge(a[k],b[k]);else a[k]=b[k];});return a;}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Sauvegarde locale pleine ou bloquée. Exporte tes données puis libère de l’espace.');}}
function today(){return new Date().toISOString().slice(0,10);}function parseDate(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}function iso(d){const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10);}function fmt(isoDate){return parseDate(isoDate).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}function monthTitle(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});}function hijri(){try{return new Intl.DateTimeFormat('fr-FR-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'}).format(new Date());}catch(e){return 'Calendrier hégirien';}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function clamp(n,min,max){return Math.max(min,Math.min(max,Number(n)||0));}
function logFor(date=ui.selectedDate){if(!state.logs[date])state.logs[date]={prayers:{},quranRead:0,arabicMinutes:0,dhikr:{},habits:{},mood:'🙂',note:'',done:false};return state.logs[date];}
function prayerCount(log){return prayers.filter(p=>log.prayers&&log.prayers[p]).length;}function dhikrTotal(log){return Object.values(log.dhikr||{}).reduce((a,b)=>a+(Number(b)||0),0);}function dailyScore(log){if(!log)return 0;let score=0;score+=prayerCount(log)/5*45;score+=Math.min(1,(Number(log.quranRead)||0)/(state.goals.quranVerses||1))*18;score+=Math.min(1,(Number(log.arabicMinutes)||0)/(state.goals.arabicMinutes||1))*12;score+=Math.min(1,dhikrTotal(log)/(state.goals.dhikrTarget||1))*15;const hs=state.settings.habits||[];score+=hs.length?hs.filter(h=>log.habits&&log.habits[h]).length/hs.length*10:10;return Math.round(score);}function streak(){let s=0;let d=parseDate(today());for(;;){const v=state.logs[iso(d)];if(v&&dailyScore(v)>=60){s++;d.setDate(d.getDate()-1);}else break;}return s;}function datesBack(n){const arr=[];for(let i=n-1;i>=0;i--){const d=parseDate(today());d.setDate(d.getDate()-i);arr.push(iso(d));}return arr;}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>{root.innerHTML='';},2800);}
function init(){try{document.documentElement.dataset.theme=state.settings.theme||'light';document.getElementById('fallback').classList.add('hidden');document.getElementById('appRoot').classList.remove('hidden');render();bindEvents();loadQuranFromCache();if(!state.profile)showOnboarding();}catch(e){document.getElementById('fallback').classList.remove('hidden');document.getElementById('fallback').innerHTML='<div class="boot-card errorBox"><strong>Erreur au démarrage.</strong><br>'+esc(e.message||e)+'</div>';}}
function bindEvents(){document.addEventListener('click',onClick);document.addEventListener('input',onInput);document.addEventListener('change',onChange);}
function onClick(e){const t=e.target.closest('[data-action],[data-route]');if(!t)return;if(t.dataset.route){ui.page=t.dataset.route;render();window.scrollTo({top:0,behavior:'smooth'});return;}const a=t.dataset.action;const v=t.dataset.value;if(a==='prev-day'){shiftDay(-1);}if(a==='next-day'){shiftDay(1);}if(a==='today'){ui.selectedDate=today();ui.calMonth=today().slice(0,7);ui.page='today';render();}if(a==='toggle-prayer'){const l=logFor();l.prayers[v]=!l.prayers[v];saveState();render();}if(a==='toggle-task'){toggleTask(v);}if(a==='inc-dhikr'){const l=logFor();l.dhikr[v]=(l.dhikr[v]||0)+1;saveState();render();}if(a==='dec-dhikr'){const l=logFor();l.dhikr[v]=Math.max(0,(l.dhikr[v]||0)-1);saveState();render();}if(a==='reset-dhikr'){logFor().dhikr={};saveState();render();}if(a==='prev-month'){shiftMonth(-1);}if(a==='next-month'){shiftMonth(1);}if(a==='select-date'){ui.selectedDate=v;ui.page='today';render();}if(a==='load-quran'){installQuran();}if(a==='clear-quran'){clearQuran();}if(a==='surah'){ui.quranSurah=Number(v);ui.quranSearch='';render();}if(a==='mark-quran'){const l=logFor();l.quranRead+=Number(v)||1;state.quran.last={surah:ui.quranSurah,verse:Number(t.dataset.verse)||1};saveState();render();toast('Lecture ajoutée au jour sélectionné.');}if(a==='lesson'){ui.arabicLesson=Number(v);ui.quizChoice=null;render();}if(a==='complete-lesson'){state.arabic.completed[ui.arabicLesson]=true;logFor().arabicMinutes=Math.max(logFor().arabicMinutes,state.goals.arabicMinutes);saveState();render();toast('Leçon validée.');}if(a==='quiz'){answerQuiz(Number(v));}if(a==='dua-filter'){ui.duaFilter=v;render();}if(a==='fav-dua'){toggleFav(v);}if(a==='stats-period'){ui.statsPeriod=Number(v);render();}if(a==='stats-date'){ui.selectedDate=v;ui.page='today';render();}if(a==='theme'){state.settings.theme=state.settings.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.settings.theme;saveState();render();}if(a==='export'){exportData();}if(a==='import-click'){document.getElementById('importFile').click();}if(a==='reset-onboarding'){state.profile=null;saveState();showOnboarding();}if(a==='reset-all'){if(confirm('Tout supprimer ? Pense à exporter avant.')){localStorage.removeItem(KEY);state=initialState();saveState();location.reload();}}if(a==='ob-next'){obNext();}if(a==='ob-prev'){ui.onboardingStep=Math.max(0,ui.onboardingStep-1);renderOnboarding();}}
function onInput(e){const t=e.target;if(t.id==='quranSearch'){ui.quranSearch=t.value;renderQuranResults();return;}if(t.dataset.field){setByPath(state,t.dataset.field,t.value);saveState();renderTopOnly();}if(t.dataset.num){setByPath(state,t.dataset.num,Number(t.value)||0);saveState();}if(t.dataset.daynum){logFor()[t.dataset.daynum]=Number(t.value)||0;saveState();renderTopOnly();}if(t.dataset.daytext){logFor()[t.dataset.daytext]=t.value;saveState();}if(t.id==='habitLines'){state.settings.habits=t.value.split('\n').map(x=>x.trim()).filter(Boolean);saveState();}}
function onChange(e){const t=e.target;if(t.id==='importFile'){importData(t.files[0]);}if(t.dataset.time){state.settings.prayerTimes[t.dataset.time]=t.value;saveState();}if(t.dataset.mood){logFor().mood=t.value;saveState();}}
function setByPath(obj,path,val){const parts=path.split('.');let o=obj;for(let i=0;i<parts.length-1;i++){o=o[parts[i]];}o[parts.at(-1)]=val;}
function render(){const root=document.getElementById('appRoot');root.innerHTML='<div class="app"><header class="top" id="topbar">'+topHtml()+'</header><div class="layout"><aside class="side">'+navHtml(false)+'<div class="sideNote"><strong>Stockage</strong><br>Données personnelles en local. Le Coran complet peut être installé dans l’app via cache local.</div></aside><main id="page">'+pageHtml()+'</main></div></div><nav class="bottomNav">'+navHtml(true)+'</nav>';renderQuranResults();renderTopOnly();}
function renderTopOnly(){const top=document.getElementById('topbar');if(top)top.innerHTML=topHtml();}
function topHtml(){const name=state.profile&&state.profile.name?state.profile.name:'Bienvenue';return '<div class="top-inner"><div class="logo">☾</div><div class="titleBlock"><h1>Muslim Planner</h1><p>'+esc(name)+' · '+esc(hijri())+'</p></div><div class="topActions"><button class="iconBtn desktopOnly" data-route="settings" title="Réglages">⚙️</button><button class="iconBtn" data-action="theme" title="Mode nuit">'+(state.settings.theme==='dark'?'☀️':'🌙')+'</button></div></div>';}
function navHtml(mobile){const list=(mobile?mobilePages:pages.map(p=>p[0])).map(id=>pages.find(p=>p[0]===id));return '<div class="'+(mobile?'bottomGrid':'nav')+'">'+list.map(p=>mobile?'<button class="bottomBtn '+(ui.page===p[0]?'active':'')+'" data-route="'+p[0]+'"><b>'+p[1]+'</b>'+p[2]+'</button>':'<button class="navBtn '+(ui.page===p[0]?'active':'')+'" data-route="'+p[0]+'"><span>'+p[1]+'</span><span>'+p[2]+'</span></button>').join('')+'</div>';}
function pageIntro(title,sub){return '<div class="pageHead"><h2>'+title+'</h2><p>'+sub+'</p></div>';}
function pageHtml(){if(ui.page==='home')return renderHome();if(ui.page==='today')return renderToday();if(ui.page==='calendar')return renderCalendar();if(ui.page==='quran')return renderQuran();if(ui.page==='arabic')return renderArabic();if(ui.page==='duas')return renderDuas();if(ui.page==='stats')return renderStats();if(ui.page==='settings')return renderSettings();return renderHome();}
function metric(label,value,sub,p){return '<div class="card metric"><div class="label">'+esc(label)+'</div><div class="big">'+esc(value)+'</div><div class="progress"><i style="width:'+clamp(p,0,100)+'%"></i></div><div class="tiny muted">'+esc(sub)+'</div></div>';}
function renderHome(){const l=logFor(today());const score=dailyScore(l);return '<section class="hero"><div class="heroGrid"><div><h2>Salam '+esc(state.profile&&state.profile.name?state.profile.name:'')+' 🌙</h2><p>Ton planner suit une logique simple : aujourd’hui → calendrier → apprentissage → statistiques. Chaque action nourrit ton suivi.</p><div class="badges"><span class="badge">Score '+score+'%</span><span class="badge">Streak '+streak()+' j</span><span class="badge">'+prayerCount(l)+'/5 prières</span></div></div><div class="calliBox"><div class="calli">رَبِّ زِدْنِي عِلْمًا</div><p class="tiny">Seigneur, augmente-moi en science.</p></div></div></section><div class="grid g4" style="margin-top:14px">'+metric('Score du jour',score+'%','Objectif 70%+',score)+metric('Prières',prayerCount(l)+'/5','Aujourd’hui',prayerCount(l)/5*100)+metric('Coran',Number(l.quranRead||0)+' v.','Objectif '+state.goals.quranVerses,Math.min(100,(l.quranRead/state.goals.quranVerses)*100))+metric('Dhikr',dhikrTotal(l),'Objectif '+state.goals.dhikrTarget,Math.min(100,dhikrTotal(l)/state.goals.dhikrTarget*100))+'</div><div class="grid g2" style="margin-top:14px"><div class="card soft"><div class="between"><div><h3>Suite logique</h3><p class="muted small">Commence par le jour, puis visualise au calendrier, ensuite progresse dans Coran/Arabe/Dhikr.</p></div><div class="ring" style="--p:'+score+'"><span>'+score+'%</span></div></div><div class="divider"></div><div class="grid"><button class="btn primary" data-route="today">Ouvrir mon plan du jour</button><button class="btn" data-route="calendar">Voir mon mois</button></div></div><div class="card"><h3>Priorité personnalisée</h3>'+personalAdvice()+'<div class="divider"></div><div class="quoteBox">La valeur du planner n’est pas d’avoir beaucoup de boutons, mais de te faire avancer chaque jour dans un ordre clair.</div></div></div>';}
function personalAdvice(){const p=state.profile||{};if(p.prayer==='restart')return '<p>Priorité : stabiliser les prières. Ne surcharge pas la journée : 5 prières, un peu de Coran, un dhikr simple.</p>';if(p.quran==='daily')return '<p>Tu lis déjà le Coran : l’objectif est de transformer la lecture en constance mesurable et en compréhension.</p>';return '<p>Routine conseillée : prières + 10 versets + 10 minutes d’arabe + 100 dhikr.</p>';}
function renderToday(){const l=logFor();const score=dailyScore(l);return pageIntro('Plan du jour','Date sélectionnée : '+fmt(ui.selectedDate)+'. Les compteurs sont liés à cette date, pas à la page.')+'<div class="card soft"><div class="between stack"><div><h3>'+fmt(ui.selectedDate)+'</h3><p class="muted small">Score : '+score+'% · Humeur : '+esc(l.mood||'🙂')+'</p></div><div class="row wrap"><button class="btn" data-action="prev-day">← Jour précédent</button><button class="btn" data-action="today">Aujourd’hui</button><button class="btn" data-action="next-day">Jour suivant →</button></div></div></div><div class="grid" style="margin-top:14px"><div class="card"><div class="between"><h3>1. Prières obligatoires</h3><span class="pill">'+prayerCount(l)+'/5</span></div><div class="prayerGrid">'+prayers.map(p=>'<button class="prayerCard '+(l.prayers[p]?'done':'')+'" data-action="toggle-prayer" data-value="'+p+'"><div class="checkCircle">'+(l.prayers[p]?'✓':'')+'</div><div class="prayerName">'+p+'</div><div class="prayerTime">'+esc(state.settings.prayerTimes[p]||'horaire manuel')+'</div></button>').join('')+'</div></div><div class="grid g2"><div class="card"><h3>2. Coran & apprentissage</h3><div class="grid g2"><label>Versets lus<input data-daynum="quranRead" type="number" min="0" value="'+Number(l.quranRead||0)+'"></label><label>Minutes arabe<input data-daynum="arabicMinutes" type="number" min="0" value="'+Number(l.arabicMinutes||0)+'"></label></div><div class="badges"><button class="btn" data-route="quran">Lire le Coran</button><button class="btn" data-route="arabic">Continuer la formation arabe</button></div></div><div class="card"><h3>3. Dhikr du jour</h3>'+dhikrCounters(l)+'</div></div><div class="card"><h3>4. Habitudes et note</h3><div class="grid">'+(state.settings.habits||[]).map(h=>taskHtml(h,!!l.habits[h])).join('')+'</div><div class="divider"></div><div class="grid g2"><label>Humeur<select data-mood="1"><option '+sel(l.mood,'🙂')+'>🙂</option><option '+sel(l.mood,'😌')+'>😌</option><option '+sel(l.mood,'😔')+'>😔</option><option '+sel(l.mood,'🔥')+'>🔥</option></select></label><label>Note du jour<textarea data-daytext="note" placeholder="Ce que j’ai appris, ce que je veux améliorer…">'+esc(l.note||'')+'</textarea></label></div></div></div>';}
function sel(a,b){return a===b?'selected':'';}function shiftDay(n){const d=parseDate(ui.selectedDate);d.setDate(d.getDate()+n);ui.selectedDate=iso(d);ui.calMonth=ui.selectedDate.slice(0,7);render();}function taskHtml(h,done){return '<div class="task '+(done?'done':'')+'"><button class="toggle" data-action="toggle-task" data-value="'+esc(h)+'">'+(done?'✓':'')+'</button><div><div class="taskTitle">'+esc(h)+'</div><div class="taskSub">Habitude personnalisée</div></div><span class="pill">'+(done?'fait':'à faire')+'</span></div>';}function toggleTask(h){const l=logFor();l.habits[h]=!l.habits[h];saveState();render();}
function dhikrCounters(l){const items=[['subhanAllah','سُبْحَانَ اللّٰهِ'],['alhamdulillah','الْحَمْدُ لِلّٰهِ'],['allahuAkbar','اللّٰهُ أَكْبَرُ'],['istighfar','أَسْتَغْفِرُ اللّٰهَ']];return '<div class="grid">'+items.map(x=>'<div class="counter"><button data-action="dec-dhikr" data-value="'+x[0]+'">−</button><div><div class="arabic" style="font-size:22px;text-align:center">'+x[1]+'</div><div class="num">'+Number(l.dhikr[x[0]]||0)+'</div></div><button data-action="inc-dhikr" data-value="'+x[0]+'">+</button></div>').join('')+'<button class="btn danger" data-action="reset-dhikr">Remettre les compteurs de cette date à zéro</button></div>';}
function renderCalendar(){return pageIntro('Calendrier','Clique sur un jour pour ouvrir son suivi. Le mois donne une vraie vision de progression.')+'<div class="card"><div class="monthHead"><button class="iconBtn" data-action="prev-month">←</button><h3 style="margin:0;text-transform:capitalize">'+monthTitle(ui.calMonth)+'</h3><button class="iconBtn" data-action="next-month">→</button></div><div class="divider"></div><div class="calendar">'+['L','M','M','J','V','S','D'].map(d=>'<div class="dow">'+d+'</div>').join('')+calendarCells()+'</div></div>';}
function shiftMonth(n){const [y,m]=ui.calMonth.split('-').map(Number);const d=new Date(y,m-1+n,1);ui.calMonth=iso(d).slice(0,7);render();}
function calendarCells(){const [y,m]=ui.calMonth.split('-').map(Number);const first=new Date(y,m-1,1);const start=new Date(first);const offset=(first.getDay()+6)%7;start.setDate(first.getDate()-offset);let out='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const id=iso(d);const l=state.logs[id];const score=dailyScore(l);const outMonth=d.getMonth()!==m-1;out+='<button class="dayCell '+(outMonth?'out ':'')+(id===today()?'today ':'')+(id===ui.selectedDate?'selected ':'')+'" data-action="select-date" data-value="'+id+'"><span class="dayNum">'+d.getDate()+'</span><span class="dots">'+[0,1,2,3,4].map(j=>'<i class="dot '+(l&&prayerCount(l)>j?'ok':'')+'"></i>').join('')+'</span><span class="scoreMini"><i style="width:'+score+'%"></i></span></button>';}return out;}
function renderQuran(){const status=quranData?('Coran chargé : '+quranData.length+' sourates'):(ui.quranLoading?'Chargement du Coran complet…':(state.quran.installed?'Cache trouvé, chargement…':'Coran complet non installé localement'));return pageIntro('Coran complet','Lecture arabe + traduction française. Le bouton installe le Coran complet dans le cache local de l’application.')+'<div class="card soft"><div class="between stack"><div><h3>'+esc(status)+'</h3><p class="muted small">Source : quran-json FR. Si l’installation échoue dans l’aperçu iPhone, ouvre le fichier dans Safari.</p></div><div class="row wrap"><button class="btn primary" data-action="load-quran">Installer / recharger le Coran complet</button><button class="btn danger" data-action="clear-quran">Vider le cache Coran</button></div></div>'+(ui.quranError?'<div class="errorBox" style="margin-top:12px">'+esc(ui.quranError)+'</div>':'')+'</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Sourates</h3><input id="quranSearch" value="'+esc(ui.quranSearch)+'" placeholder="Rechercher : Al-Fatihah, science, patience…"><div id="surahList" class="surahList" style="margin-top:12px"></div></div><div class="card"><div id="quranResults"></div></div></div>';}
function renderQuranResults(){const list=document.getElementById('surahList');const results=document.getElementById('quranResults');if(!list||!results)return;const data=quranData||quranFallback;const q=(ui.quranSearch||'').toLowerCase().trim();if(q){const matches=[];data.forEach(s=>s.verses.forEach(v=>{if((s.transliteration+' '+s.translation+' '+v.translation+' '+v.text).toLowerCase().includes(q))matches.push({s,v});}));list.innerHTML=data.map(s=>surahButton(s)).join('');results.innerHTML='<h3>Recherche</h3><p class="muted small">'+matches.length+' résultat(s)</p><div class="quranReader">'+matches.slice(0,60).map(x=>ayahHtml(x.s,x.v)).join('')+'</div>';return;}list.innerHTML=data.map(s=>surahButton(s)).join('');const s=data.find(x=>x.id===ui.quranSurah)||data[0];results.innerHTML='<div class="between"><div><h3>'+s.id+'. '+esc(s.transliteration)+'</h3><p class="muted small">'+esc(s.translation)+' · '+s.total_verses+' versets</p></div><span class="pill">'+(s.type==='meccan'?'Mecquoise':'Médinoise')+'</span></div><div class="divider"></div><div class="quranReader">'+s.verses.map(v=>ayahHtml(s,v)).join('')+'</div>';}
function surahButton(s){return '<button class="surahBtn '+(ui.quranSurah===s.id?'active':'')+'" data-action="surah" data-value="'+s.id+'"><strong>'+s.id+'. '+esc(s.transliteration)+'</strong><br><span class="tiny muted">'+esc(s.translation)+' · '+s.total_verses+' v.</span></button>';}
function ayahHtml(s,v){return '<article class="ayah"><div class="ayahTop"><span class="ayahNum">'+s.id+':'+v.id+'</span><button class="btn" data-action="mark-quran" data-value="1" data-verse="'+v.id+'">+ lu</button></div><div class="arabic">'+esc(v.text)+'</div><div class="translation">'+esc(v.translation)+'</div></article>';}
async function loadQuranFromCache(){try{const cached=await idbGet(QURAN_KEY);if(cached&&Array.isArray(cached)){quranData=cached;state.quran.installed=true;saveState();render();return;}if(state.settings.quranAuto)installQuran(false);}catch(e){}}
async function installQuran(show=true){try{ui.quranLoading=true;ui.quranError='';render();const res=await fetch(QURAN_URL,{cache:'force-cache'});if(!res.ok)throw new Error('Téléchargement impossible ('+res.status+').');const data=await res.json();if(!Array.isArray(data)||data.length<114)throw new Error('Données Coran incomplètes.');quranData=data;await idbSet(QURAN_KEY,data);state.quran.installed=true;state.quran.installedAt=new Date().toISOString();saveState();ui.quranLoading=false;ui.quranError='';render();if(show)toast('Coran complet installé localement.');}catch(e){ui.quranLoading=false;ui.quranError='Impossible de charger le Coran complet : '+(e.message||e)+'. Les sourates de secours restent disponibles.';render();}}
async function clearQuran(){try{await idbDel(QURAN_KEY);}catch(e){}quranData=null;state.quran.installed=false;saveState();render();toast('Cache Coran vidé.');}
function openDb(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB non supporté'));return;}const r=indexedDB.open(QURAN_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(QURAN_STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function idbGet(k){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(QURAN_STORE,'readonly');const req=tx.objectStore(QURAN_STORE).get(k);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function idbSet(k,v){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(QURAN_STORE,'readwrite');tx.objectStore(QURAN_STORE).put(v,k);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
async function idbDel(k){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(QURAN_STORE,'readwrite');tx.objectStore(QURAN_STORE).delete(k);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
function renderArabic(){const done=Object.keys(state.arabic.completed||{}).length;const lesson=arabicLessons.find(x=>x.id===ui.arabicLesson)||arabicLessons[0];return pageIntro('Formation arabe','Une progression guidée : leçon → vocabulaire → quiz → validation. Pas juste cocher des lettres.')+'<div class="grid g3"><div class="card"><div class="big">'+done+'/'+arabicLessons.length+'</div><p class="muted small">leçons validées</p></div><div class="card"><div class="big">'+(logFor().arabicMinutes||0)+' min</div><p class="muted small">aujourd’hui</p></div><div class="card"><button class="btn primary" data-action="complete-lesson">Valider la leçon du jour</button></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Parcours</h3><div class="grid">'+arabicLessons.map(l=>'<button class="lessonCard '+(ui.arabicLesson===l.id?'soft':'')+'" data-action="lesson" data-value="'+l.id+'"><div class="between"><strong>'+l.id+'. '+esc(l.title)+'</strong><span class="pill">'+(state.arabic.completed[l.id]?'✓ fait':esc(l.level))+'</span></div><p class="muted small">'+esc(l.goal)+'</p></button>').join('')+'</div></div><div class="card"><h3>'+lesson.id+'. '+esc(lesson.title)+'</h3><p>'+esc(lesson.content)+'</p><div class="divider"></div><h4>Vocabulaire</h4><div class="vocabGrid">'+lesson.vocab.map(v=>'<div class="flash"><div class="ar">'+v[0]+'</div><strong>'+esc(v[1])+'</strong><span class="muted small">'+esc(v[2])+'</span></div>').join('')+'</div><div class="divider"></div>'+quizHtml(lesson)+'</div></div>';}
function quizHtml(lesson){const answered=state.arabic.quiz[lesson.id];return '<h4>Quiz</h4><p class="muted small">'+esc(lesson.quiz.q)+'</p>'+lesson.quiz.options.map((o,i)=>'<button class="btn quizOption '+(answered!==undefined?(i===lesson.quiz.a?'correct':(i===answered?'wrong':'')):'')+'" data-action="quiz" data-value="'+i+'">'+esc(o)+'</button>').join('');}
function answerQuiz(i){const lesson=arabicLessons.find(x=>x.id===ui.arabicLesson)||arabicLessons[0];state.arabic.quiz[lesson.id]=i;saveState();render();toast(i===lesson.quiz.a?'Bonne réponse !':'Pas exactement, relis la leçon.');}
function renderDuas(){const cats=['Tous',...new Set(duaLibrary.map(d=>d.cat))];const l=logFor();const list=duaLibrary.filter(d=>ui.duaFilter==='Tous'||d.cat===ui.duaFilter);return pageIntro('Dhikr & duʿā','Compteurs quotidiens + bibliothèque alimentée. Les favoris restent enregistrés.')+'<div class="grid g2"><div class="card"><h3>Compteurs de la date</h3>'+dhikrCounters(l)+'</div><div class="card"><h3>Bibliothèque</h3><div class="badges">'+cats.map(c=>'<button class="badge" data-action="dua-filter" data-value="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div><div class="duaList" style="margin-top:12px">'+list.map(d=>'<div class="dua"><div class="between"><strong>'+esc(d.title)+'</strong><button class="iconBtn" data-action="fav-dua" data-value="'+d.id+'">'+(state.favorites.duas.includes(d.id)?'★':'☆')+'</button></div><span class="pill">'+esc(d.cat)+'</span><div class="arabic">'+esc(d.ar)+'</div><p class="translation">'+esc(d.fr)+'</p></div>').join('')+'</div></div></div>';}
function toggleFav(id){const arr=state.favorites.duas;if(arr.includes(id))state.favorites.duas=arr.filter(x=>x!==id);else arr.push(id);saveState();render();}
function renderStats(){const n=ui.statsPeriod;const ds=datesBack(n);const scores=ds.map(d=>dailyScore(state.logs[d]));const avg=Math.round(scores.reduce((a,b)=>a+b,0)/(scores.length||1));const prayersTotal=ds.reduce((a,d)=>a+prayerCount(state.logs[d]||{}),0);const quranTotal=ds.reduce((a,d)=>a+(Number(state.logs[d]?.quranRead)||0),0);const dhikr=ds.reduce((a,d)=>a+dhikrTotal(state.logs[d]||{}),0);return pageIntro('Statistiques','Tu peux changer la période et cliquer sur une barre pour ouvrir le jour correspondant.')+'<div class="between stack"><div class="segment three"><button class="segBtn '+(n===7?'active':'')+'" data-action="stats-period" data-value="7">7 jours</button><button class="segBtn '+(n===30?'active':'')+'" data-action="stats-period" data-value="30">30 jours</button><button class="segBtn '+(n===365?'active':'')+'" data-action="stats-period" data-value="365">Année</button></div><button class="btn" data-route="calendar">Voir calendrier</button></div><div class="grid g4" style="margin-top:14px">'+metric('Score moyen',avg+'%','sur '+n+' jours',avg)+metric('Prières',prayersTotal+'/'+(n*5),'total période',prayersTotal/(n*5)*100)+metric('Coran',quranTotal+' v.','versets lus',100)+metric('Dhikr',dhikr,'total période',100)+'</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Score par jour</h3><div class="barChart">'+ds.map((d,i)=>'<button class="bar" style="height:'+Math.max(4,scores[i])+'%" data-action="stats-date" data-value="'+d+'" title="'+d+' · '+scores[i]+'%"><span>'+parseDate(d).getDate()+'</span></button>').join('')+'</div></div><div class="card"><h3>Lecture de la période</h3><p class="muted">Si une barre est basse, ouvre le jour et vois ce qui manque : prières, Coran, arabe, dhikr ou habitudes.</p><div class="divider"></div><div class="quoteBox">Le but des stats n’est pas de culpabiliser, mais de rendre visible ta constance.</div></div></div>';}
function renderSettings(){return pageIntro('Réglages','Tout ce qui influence le planner : profil, objectifs, prières, thème, sauvegarde.')+'<div class="grid g2"><div class="card"><h3>Profil</h3><label>Prénom<input data-field="profile.name" value="'+esc(state.profile?.name||'')+'"></label><label>Objectif<select data-field="profile.intent"><option '+sel(state.profile?.intent,'Stabiliser mes prières')+'>Stabiliser mes prières</option><option '+sel(state.profile?.intent,'Lire plus de Coran')+'>Lire plus de Coran</option><option '+sel(state.profile?.intent,'Apprendre arabe et religion')+'>Apprendre arabe et religion</option><option '+sel(state.profile?.intent,'Préparer Ramadan')+'>Préparer Ramadan</option></select></label><button class="btn" data-action="reset-onboarding">Relancer le questionnaire</button></div><div class="card"><h3>Objectifs quotidiens</h3><label>Versets de Coran<input type="number" min="0" data-num="goals.quranVerses" value="'+state.goals.quranVerses+'"></label><label>Minutes arabe<input type="number" min="0" data-num="goals.arabicMinutes" value="'+state.goals.arabicMinutes+'"></label><label>Dhikr cible<input type="number" min="0" data-num="goals.dhikrTarget" value="'+state.goals.dhikrTarget+'"></label></div><div class="card"><h3>Horaires de prière manuels</h3><div class="grid g2">'+prayers.map(p=>'<label>'+p+'<input type="time" data-time="'+p+'" value="'+esc(state.settings.prayerTimes[p]||'')+'"></label>').join('')+'</div></div><div class="card"><h3>Habitudes</h3><textarea id="habitLines">'+esc((state.settings.habits||[]).join('\n'))+'</textarea><p class="muted tiny">Une habitude par ligne.</p></div><div class="card"><h3>Apparence & données</h3><div class="grid"><button class="btn" data-action="theme">Basculer mode '+(state.settings.theme==='dark'?'clair':'nuit')+'</button><button class="btn" data-action="export">Exporter sauvegarde JSON</button><button class="btn" data-action="import-click">Importer sauvegarde JSON</button><input class="hidden" id="importFile" type="file" accept="application/json"><button class="btn danger" data-action="reset-all">Tout réinitialiser</button></div></div><div class="card"><h3>Coran complet</h3><p class="muted small">Statut : '+(state.quran.installed?'installé localement':'non installé')+'</p><div class="grid"><button class="btn primary" data-action="load-quran">Installer / mettre à jour le Coran complet</button><button class="btn danger" data-action="clear-quran">Vider le cache Coran</button></div></div></div>';}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='muslim-planner-v5-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state=deepMerge(initialState(),JSON.parse(r.result));saveState();render();toast('Sauvegarde importée.');}catch(e){toast('JSON invalide.');}};r.readAsText(file);}
function showOnboarding(){ui.onboardingStep=0;renderOnboarding();document.body.classList.add('modal-open');}
function renderOnboarding(){const root=document.getElementById('modalRoot');const step=ui.onboardingStep;root.innerHTML='<div class="modal" id="onboarding"><div class="modalCard"><div class="steps">'+[0,1,2,3].map(i=>'<i class="stepDot '+(i<=step?'active':'')+'"></i>').join('')+'</div>'+obStepHtml(step)+'<div class="between" style="margin-top:18px"><button class="btn" data-action="ob-prev" '+(step===0?'style="visibility:hidden"':'')+'>Retour</button><button class="btn primary" data-action="ob-next">'+(step===3?'Créer mon planner':'Continuer')+'</button></div></div></div>';}
function obStepHtml(step){const p=state.profile||{};if(step===0)return '<div class="obStep active"><h2>Bienvenue 🌙</h2><p class="muted">Avant d’ouvrir l’app, je personnalise ton dashboard.</p><label>Ton prénom<input id="obName" value="'+esc(p.name||'')+'" placeholder="Ex : Adil"></label><label>Ton intention principale<select id="obIntent"><option>Stabiliser mes prières</option><option>Lire plus de Coran</option><option>Apprendre arabe et religion</option><option>Préparer Ramadan</option></select></label></div>';if(step===1)return '<div class="obStep active"><h2>Tes habitudes</h2><div class="grid g2"><label>Prières<select id="obPrayer"><option value="all">Je prie les 5</option><option value="some">J’en manque parfois</option><option value="restart">Je reprends progressivement</option></select></label><label>Coran<select id="obQuran"><option value="rare">Rarement</option><option value="weekly">Chaque semaine</option><option value="daily">Quotidiennement</option></select></label><label>Arabe<select id="obArabic"><option value="beginner">Débutant</option><option value="reader">Je lis un peu</option><option value="intermediate">Intermédiaire</option></select></label><label>Temps par jour<select id="obTime"><option value="10">10 min</option><option value="20">20 min</option><option value="30">30 min</option><option value="45">45 min+</option></select></label></div></div>';if(step===2)return '<div class="obStep active"><h2>Objectifs</h2><div class="grid g3"><label>Versets/jour<input id="obQuranVerses" type="number" value="10" min="1"></label><label>Arabe min/jour<input id="obArabicMin" type="number" value="10" min="1"></label><label>Dhikr/jour<input id="obDhikr" type="number" value="100" min="1"></label></div><p class="muted small">Tu pourras tout modifier ensuite.</p></div>';return '<div class="obStep active"><h2>Structure retenue</h2><div class="grid"><div class="task"><span class="toggle">1</span><div><strong>Plan du jour</strong><div class="taskSub">prières, Coran, arabe, dhikr</div></div></div><div class="task"><span class="toggle">2</span><div><strong>Calendrier</strong><div class="taskSub">suivi mensuel réel</div></div></div><div class="task"><span class="toggle">3</span><div><strong>Formation</strong><div class="taskSub">Coran + arabe + duʿā + stats</div></div></div></div></div>';}
function obNext(){if(ui.onboardingStep<3){ui.onboardingStep++;renderOnboarding();return;}const name=document.getElementById('obName')?.value?.trim()||'Mon frère / ma sœur';const intent=document.getElementById('obIntent')?.value||'Stabiliser mes prières';state.profile={name,intent,prayer:document.getElementById('obPrayer')?.value||'some',quran:document.getElementById('obQuran')?.value||'rare',arabic:document.getElementById('obArabic')?.value||'beginner',time:Number(document.getElementById('obTime')?.value||20)};state.goals.quranVerses=Number(document.getElementById('obQuranVerses')?.value||10);state.goals.arabicMinutes=Number(document.getElementById('obArabicMin')?.value||10);state.goals.dhikrTarget=Number(document.getElementById('obDhikr')?.value||100);if(state.profile.prayer==='restart'){state.goals.quranVerses=Math.min(state.goals.quranVerses,5);state.goals.arabicMinutes=Math.min(state.goals.arabicMinutes,10);}saveState();document.getElementById('modalRoot').innerHTML='';document.body.classList.remove('modal-open');render();toast('Planner personnalisé créé.');}
init();
})();
</script>
</body>
